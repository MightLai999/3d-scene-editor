<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 場景編輯器 — Three.js Studio</title>
  <style>
    :root {
      --bg-panel: rgba(20, 22, 28, 0.86);
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-hover: rgba(255, 255, 255, 0.11);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #4f8cff;
      --accent-hover: #6ba0ff;
      --danger: #ef4444;
      --text: #eef1f6;
      --text-muted: #9aa3b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Top Toolbar */
    .topbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      max-width: calc(100vw - 580px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .topbar .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 3px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--bg-hover); }

    .btn.active {
      background: rgba(79, 140, 255, 0.22);
      border-color: rgba(79, 140, 255, 0.6);
      color: #cfe0ff;
    }

    .btn.danger { color: #fca5a5; }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Side Panels */
    .panel {
      position: fixed;
      top: 12px;
      bottom: 48px;
      width: 276px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      z-index: 15;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .panel.left { left: 12px; }
    .panel.right { right: 12px; }

    .panel-header {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-body::-webkit-scrollbar { width: 6px; }
    .panel-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Template Selector */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .tpl-btn {
      padding: 8px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .tpl-btn:hover {
      background: var(--bg-hover);
      border-color: rgba(79, 140, 255, 0.5);
    }

    .tpl-btn.active {
      background: rgba(79, 140, 255, 0.2);
      border-color: rgba(79, 140, 255, 0.65);
      color: #dbeafe;
    }

    /* Category Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 3px;
      border-radius: 8px;
    }

    .tab-btn {
      padding: 5px 4px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: rgba(79, 140, 255, 0.28);
      color: #fff;
      font-weight: 600;
    }

    .add-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .add-btn {
      padding: 7px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .add-btn:hover {
      background: var(--bg-hover);
      border-color: rgba(79, 140, 255, 0.5);
    }

    /* Scene List */
    .object-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .object-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      border-radius: 7px;
      background: var(--bg-card);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .object-item:hover { background: var(--bg-hover); }
    .object-item.selected {
      background: rgba(79, 140, 255, 0.2);
      border-color: rgba(79, 140, 255, 0.55);
    }

    .object-item .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .object-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Form Controls */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .field label, .field-row label {
      font-size: 12px;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus { border-color: var(--accent); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 34px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      padding: 1px;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .vec3-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .vec3-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .vec3-item span {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      padding-left: 2px;
    }
    .vec3-item span.x { color: #f87171; }
    .vec3-item span.y { color: #4ade80; }
    .vec3-item span.z { color: #60a5fa; }

    .empty-state {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 16px 8px;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }

    /* Bottom Status Bar */
    .statusbar {
      position: fixed;
      bottom: 10px;
      left: 12px;
      right: 12px;
      height: 30px;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 15;
    }

    .kbd {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-family: monospace;
      font-size: 10px;
      margin: 0 2px;
    }

    .val-badge {
      font-family: monospace;
      font-size: 11px;
      color: var(--text);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Toolbar -->
  <div class="topbar">
    <a class="btn" href="./index.html" style="text-decoration:none;" title="返回作品集首頁">← 首頁</a>
    <div class="divider"></div>
    <button class="btn active" id="mode-translate" title="移動 (W)">✥ 移動</button>
    <button class="btn" id="mode-rotate" title="旋轉 (E)">↻ 旋轉</button>
    <button class="btn" id="mode-scale" title="縮放 (R)">⤢ 縮放</button>

    <div class="divider"></div>

    <button class="btn" id="cam-reset" title="重置視角">⌂ 重置</button>
    <button class="btn" id="cam-top" title="俯視角">俯視</button>
    <button class="btn" id="cam-front" title="前視角">前視</button>
    <button class="btn" id="cam-focus" title="聚焦選取物件 (F)">◎ 聚焦</button>

    <div class="divider"></div>

    <button class="btn" id="btn-duplicate" title="複製選取物件 (Ctrl+D)" disabled>⧉ 複製</button>
    <button class="btn danger" id="btn-delete" title="刪除選取物件 (Del)" disabled>✕ 刪除</button>
  </div>

  <!-- Left Panel: Templates, Object Library & Hierarchy -->
  <aside class="panel left">
    <div class="panel-header">
      <span>場景與物件庫</span>
      <button class="btn danger" id="btn-clear" style="padding: 3px 7px; font-size: 11px;">清空</button>
    </div>
    <div class="panel-body">
      <!-- Scene Templates -->
      <div>
        <div class="section-title">場景範本（一鍵切換）</div>
        <div class="template-grid">
          <button class="tpl-btn active" data-tpl="city">🏙️ 迷你城市</button>
          <button class="tpl-btn" data-tpl="nature">🌲 自然景觀</button>
          <button class="tpl-btn" data-tpl="indoor">🛋️ 室內房間</button>
          <button class="tpl-btn" data-tpl="empty">✨ 空白起手</button>
        </div>
      </div>

      <!-- Categorized Object Library -->
      <div>
        <div class="section-title">新增物件</div>
        <div class="tabs">
          <button class="tab-btn active" data-cat="city">城市</button>
          <button class="tab-btn" data-cat="nature">自然</button>
          <button class="tab-btn" data-cat="indoor">室內</button>
          <button class="tab-btn" data-cat="basic">幾何</button>
        </div>
        <div class="add-grid" id="add-grid"></div>
      </div>

      <!-- Scene Object List -->
      <div style="flex: 1;">
        <div class="section-title">場景物件 (<span id="obj-count">0</span>)</div>
        <div class="object-list" id="object-list"></div>
      </div>
    </div>
  </aside>

  <!-- Right Panel: Inspector & Lighting -->
  <aside class="panel right">
    <div class="panel-header">
      <span>屬性與燈光</span>
    </div>
    <div class="panel-body">
      <div>
        <div class="section-title">選取物件屬性</div>
        <div id="inspector-empty" class="empty-state">
          點擊場景中的物件，或從左側列表選取以進行移動、旋轉、縮放與改色。
        </div>
        <div id="inspector-content" style="display: none;">
          <div class="field">
            <label for="prop-name">名稱</label>
            <input type="text" id="prop-name" />
          </div>

          <div class="field-row">
            <label for="prop-color">主體顏色</label>
            <input type="color" id="prop-color" value="#4f8cff" />
          </div>

          <div class="field">
            <div class="field-row" style="margin-bottom: 2px;">
              <label for="prop-roughness">粗糙度</label>
              <span class="val-badge" id="val-roughness">0.50</span>
            </div>
            <input type="range" id="prop-roughness" min="0" max="1" step="0.01" value="0.5" />
          </div>

          <div class="field">
            <div class="field-row" style="margin-bottom: 2px;">
              <label for="prop-metalness">金屬度</label>
              <span class="val-badge" id="val-metalness">0.10</span>
            </div>
            <input type="range" id="prop-metalness" min="0" max="1" step="0.01" value="0.1" />
          </div>

          <div class="field-row">
            <label for="prop-wireframe">線框模式</label>
            <input type="checkbox" id="prop-wireframe" />
          </div>

          <div class="field">
            <label>位置 (Position)</label>
            <div class="vec3-grid">
              <div class="vec3-item"><span class="x">X</span><input type="number" id="pos-x" step="0.2" /></div>
              <div class="vec3-item"><span class="y">Y</span><input type="number" id="pos-y" step="0.2" /></div>
              <div class="vec3-item"><span class="z">Z</span><input type="number" id="pos-z" step="0.2" /></div>
            </div>
          </div>

          <div class="field">
            <label>旋轉 (Rotation °)</label>
            <div class="vec3-grid">
              <div class="vec3-item"><span class="x">X</span><input type="number" id="rot-x" step="15" /></div>
              <div class="vec3-item"><span class="y">Y</span><input type="number" id="rot-y" step="15" /></div>
              <div class="vec3-item"><span class="z">Z</span><input type="number" id="rot-z" step="15" /></div>
            </div>
          </div>

          <div class="field">
            <label>縮放 (Scale)</label>
            <div class="vec3-grid">
              <div class="vec3-item"><span class="x">X</span><input type="number" id="scl-x" step="0.1" /></div>
              <div class="vec3-item"><span class="y">Y</span><input type="number" id="scl-y" step="0.1" /></div>
              <div class="vec3-item"><span class="z">Z</span><input type="number" id="scl-z" step="0.1" /></div>
            </div>
          </div>
        </div>
      </div>

      <hr style="border: none; border-top: 1px solid var(--border);" />

      <div>
        <div class="section-title">燈光與環境</div>

        <div class="field-row">
          <label for="env-bg">天空 / 背景色</label>
          <input type="color" id="env-bg" value="#1b2436" />
        </div>

        <div class="field">
          <div class="field-row" style="margin-bottom: 2px;">
            <label for="light-ambient">環境光強度</label>
            <span class="val-badge" id="val-ambient">0.70</span>
          </div>
          <input type="range" id="light-ambient" min="0" max="2" step="0.05" value="0.7" />
        </div>

        <div class="field">
          <div class="field-row" style="margin-bottom: 2px;">
            <label for="light-sun">主光源強度</label>
            <span class="val-badge" id="val-sun">1.80</span>
          </div>
          <input type="range" id="light-sun" min="0" max="4" step="0.1" value="1.8" />
        </div>

        <div class="field">
          <div class="field-row" style="margin-bottom: 2px;">
            <label for="light-angle">主光源角度</label>
            <span class="val-badge" id="val-angle">45°</span>
          </div>
          <input type="range" id="light-angle" min="0" max="360" step="1" value="45" />
        </div>

        <div class="field-row">
          <label for="toggle-grid">顯示網格地板</label>
          <input type="checkbox" id="toggle-grid" checked />
        </div>

        <div class="field-row">
          <label for="toggle-axes">顯示座標軸</label>
          <input type="checkbox" id="toggle-axes" />
        </div>
      </div>
    </div>
  </aside>

  <!-- Bottom Status Bar -->
  <div class="statusbar">
    <div>操作：左鍵旋轉 · 右鍵平移 · 滾輪縮放 · 點擊選取物件</div>
    <div>
      快捷鍵：<span class="kbd">W</span>移動 <span class="kbd">E</span>旋轉 <span class="kbd">R</span>縮放 <span class="kbd">F</span>聚焦 <span class="kbd">Del</span>刪除 <span class="kbd">Esc</span>取消
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1b2436');

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 250);
    let defaultCamPos = new THREE.Vector3(14, 11, 14);
    let defaultTarget = new THREE.Vector3(0, 1, 0);
    camera.position.copy(defaultCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // --- 2. Controls ---
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.07;
    orbit.target.copy(defaultTarget);
    orbit.maxDistance = 100;
    orbit.minDistance = 1.0;

    const transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.addEventListener('dragging-changed', (e) => {
      orbit.enabled = !e.value;
    });
    transformControls.addEventListener('objectChange', () => {
      if (selectedObject) syncTransformInputs(selectedObject);
    });
    scene.add(transformControls.getHelper());

    // --- 3. Lights & Helpers ---
    const ambientLight = new THREE.HemisphereLight(0xdbeafe, 0x262b38, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.8);
    dirLight.position.set(12, 18, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    const d = 20;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const shadowFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    shadowFloor.rotation.x = -Math.PI / 2;
    shadowFloor.position.y = -0.005;
    shadowFloor.receiveShadow = true;
    scene.add(shadowFloor);

    const gridHelper = new THREE.GridHelper(32, 32, 0x4b5563, 0x262b38);
    scene.add(gridHelper);

    const axesHelper = new THREE.AxesHelper(5);
    axesHelper.visible = false;
    scene.add(axesHelper);

    // --- 4. Concrete 3D Object Factories ---
    function makeMat(color, roughness = 0.55, metalness = 0.1, extra = {}) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
    }

    function addPart(group, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(...pos);
      m.rotation.set(...rot);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      return m;
    }

    const OBJECT_CATALOG = {
      city: [
        { type: 'building', icon: '🏢', label: '高樓大廈' },
        { type: 'house', icon: '🏠', label: '住宅小屋' },
        { type: 'car', icon: '🚗', label: '汽車' },
        { type: 'streetlamp', icon: '💡', label: '路燈' },
        { type: 'road', icon: '🛣️', label: '道路段' },
        { type: 'parkbench', icon: '🪑', label: '公園長椅' }
      ],
      nature: [
        { type: 'pine', icon: '🌲', label: '松樹' },
        { type: 'oak', icon: '🌳', label: '闊葉樹' },
        { type: 'rock', icon: '🪨', label: '岩石' },
        { type: 'cabin', icon: '🏡', label: '小木屋' },
        { type: 'pond', icon: '💧', label: '水池' },
        { type: 'cloud', icon: '☁️', label: '雲朵' }

        case 'plant': {

          for (let row = 0; row < 3; row++) {

            for (let b = 0; b < 5; b++) {
              addPart(g, new THREE.BoxGeometry(0.18, 0.36, 0.28), makeMat(bookColors[(row + b) % bookColors.length], 0.6), [-0.45 + b * 0.22, by, 0.1]);
            }
          }
          break;
        }

        // --- BASIC ---
        case 'box':
        case 'sphere':
        case 'cylinder':
        case 'cone':
        case 'torus':
        case 'plane':
        default: {
          const map = {
            box: [new THREE.BoxGeometry(1, 1, 1), '立方體', 0.5],
            sphere: [new THREE.SphereGeometry(0.6, 32, 24), '球體', 0.6],
            cylinder: [new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32), '圓柱', 0.6],
            cone: [new THREE.ConeGeometry(0.6, 1.3, 32), '圓錐', 0.65],
            torus: [new THREE.TorusGeometry(0.55, 0.2, 20, 48), '環面', 0.75],
            plane: [new THREE.PlaneGeometry(3, 3), '平面', 0.02]
          };
          const [geo, lbl, defY] = map[type] || map.box;
          label = lbl;
          primaryMat = makeMat(options.color || '#4f8cff', 0.45, 0.15, {
            side: type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
          });
          const m = addPart(g, geo, primaryMat, [0, defY, 0]);
          if (type === 'plane') m.rotation.x = -Math.PI / 2;
          break;
        }
      }

      g.name = options.name || `${label} ${objectCounter++}`;
      g.userData.type = type;
      g.userData.primaryMaterial = primaryMat;

      if (options.position) g.position.set(...options.position);
      if (options.rotation) g.rotation.set(...options.rotation);
      if (options.scale) g.scale.set(...options.scale);

      return g;
    }

    // --- 5. Scene Objects Management ---
    const sceneObjects = [];
    const envStaticObjects = [];
    let selectedObject = null;
    let objectCounter = 1;

    function addObjectToScene(type, options = {}, autoSelect = true) {
      const obj = buildObject(type, options);
      if (!options.position) {
        const offset = ((sceneObjects.length % 5) - 2) * 0.8;
        obj.position.set(offset, type === 'cloud' ? 5.5 : 0, offset);
      }
      scene.add(obj);
      sceneObjects.push(obj);
      if (autoSelect) {
        renderObjectList();
        selectObject(obj);
      }
      return obj;
    }

    function disposeObject(obj) {
      obj.traverse((child) => {
        if (child.isMesh) {
          child.geometry?.dispose();
          if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
          else child.material?.dispose();
        }
      });
    }

    function selectObject(obj) {
      selectedObject = obj;
      if (obj) transformControls.attach(obj);
      else transformControls.detach();
      updateInspector();
      renderObjectList();
      document.getElementById('btn-delete').disabled = !obj;
      document.getElementById('btn-duplicate').disabled = !obj;
    }

    function deleteSelected() {
      if (!selectedObject) return;
      const idx = sceneObjects.indexOf(selectedObject);
      if (idx !== -1) sceneObjects.splice(idx, 1);
      transformControls.detach();
      scene.remove(selectedObject);
      disposeObject(selectedObject);
      selectedObject = null;
      updateInspector();
      renderObjectList();
      document.getElementById('btn-delete').disabled = true;
      document.getElementById('btn-duplicate').disabled = true;
    }

    function duplicateSelected() {
      if (!selectedObject) return;
      const clone = selectedObject.clone(true);
      // Clone materials individually so edits don't affect original
      const matMap = new Map();
      clone.traverse((child) => {
        if (child.isMesh && child.material) {
          if (!matMap.has(child.material)) {
            matMap.set(child.material, child.material.clone());
          }
          child.material = matMap.get(child.material);
        }
      });
      clone.userData = {
        ...selectedObject.userData,
        primaryMaterial: matMap.get(selectedObject.userData.primaryMaterial) || null
      };
      clone.name = `${selectedObject.name} 複本`;
      clone.position.x += 1.5;
      scene.add(clone);
      sceneObjects.push(clone);
      renderObjectList();
      selectObject(clone);
    }

    function clearScene(clearEnv = false) {
      transformControls.detach();
      while (sceneObjects.length > 0) {
        const obj = sceneObjects.pop();
        scene.remove(obj);
        disposeObject(obj);
      }
      if (clearEnv) {
        while (envStaticObjects.length > 0) {
          const env = envStaticObjects.pop();
          scene.remove(env);
          disposeObject(env);
        }
      }
      selectedObject = null;
      objectCounter = 1;
      updateInspector();
      renderObjectList();
      document.getElementById('btn-delete').disabled = true;
      document.getElementById('btn-duplicate').disabled = true;
    }

    function addEnvMesh(mesh) {
      mesh.receiveShadow = true;
      scene.add(mesh);
      envStaticObjects.push(mesh);
      return mesh;
    }

        addEnvMesh(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.4, 7.2), wallMat);
        leftWall.position.set(-3.51, 1.7, 0);
        leftWall.castShadow = true;
        addEnvMesh(leftWall);

        // Rug
        const rug = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.03, 2.6), makeMat('#334155', 0.95));
        rug.position.set(0.4, 0.015, 0.7);
        addEnvMesh(rug);

        // Furniture
        addObjectToScene('sofa', { name: '客廳沙發', position: [0.4, 0, -2.2], color: '#475569' }, false);
        addObjectToScene('floorlamp', { name: '角落立燈', position: [-2.4, 0, -2.5] }, false);
        addObjectToScene('desk', { name: '工作書桌', position: [-2.4, 0, 1.1], rotation: [0, Math.PI / 2, 0] }, false);
        addObjectToScene('chair', { name: '辦公椅', position: [-1.45, 0, 1.1], rotation: [0, -Math.PI / 2, 0], color: '#3b82f6' }, false);
        addObjectToScene('bookshelf', { name: '木質書櫃', position: [2.4, 0, -3.1] }, false);
        addObjectToScene('plant', { name: '室內盆栽', position: [2.5, 0, 1.9], scale: [1.3, 1.3, 1.3] }, false);

        switchCategory('indoor');
      } else {
        // Empty
        setEnv('#161922', 0.7, 1.8, 45, true);
        defaultCamPos.set(7, 5.5, 7);
        defaultTarget.set(0, 0.5, 0);
        switchCategory('basic');
      }

      camera.position.copy(defaultCamPos);
      orbit.target.copy(defaultTarget);
      orbit.update();
      renderObjectList();
      selectObject(null);
    }

    function setEnv(bgHex, amb, sun, angleDeg, showGrid) {
      scene.background = new THREE.Color(bgHex);
      document.getElementById('env-bg').value = bgHex;

      ambientLight.intensity = amb;
      document.getElementById('light-ambient').value = amb;
      document.getElementById('val-ambient').textContent = amb.toFixed(2);

      dirLight.intensity = sun;
      document.getElementById('light-sun').value = sun;
      document.getElementById('val-sun').textContent = sun.toFixed(2);

      const rad = THREE.MathUtils.degToRad(angleDeg);
      dirLight.position.set(Math.cos(rad) * 16, 18, Math.sin(rad) * 16);
      document.getElementById('light-angle').value = angleDeg;
      document.getElementById('val-angle').textContent = `${angleDeg}°`;

      gridHelper.visible = showGrid;
      document.getElementById('toggle-grid').checked = showGrid;
    }

    // --- 7. UI Rendering ---
    const addGridEl = document.getElementById('add-grid');
    function switchCategory(cat) {
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      addGridEl.innerHTML = '';
      (OBJECT_CATALOG[cat] || []).forEach((item) => {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.innerHTML = `${item.icon} ${item.label}`;
        btn.addEventListener('click', () => addObjectToScene(item.type));
        addGridEl.appendChild(btn);
      });
    }

    const objectListEl = document.getElementById('object-list');
    const objCountEl = document.getElementById('obj-count');
    const inspectorEmpty = document.getElementById('inspector-empty');
    const inspectorContent = document.getElementById('inspector-content');

    function renderObjectList() {
      objCountEl.textContent = sceneObjects.length;
      objectListEl.innerHTML = '';
      if (sceneObjects.length === 0) {
        objectListEl.innerHTML = '<div class="empty-state">場景目前是空的，請從上方選擇範本或新增物件！</div>';
        return;
      }
      sceneObjects.forEach((obj) => {
        const item = document.createElement('div');
        item.className = 'object-item' + (obj === selectedObject ? ' selected' : '');
        const mat = obj.userData.primaryMaterial;
        const hex = mat ? '#' + mat.color.getHexString() : '#94a3b8';
        item.innerHTML = `
          <div class="meta">
            <span class="color-dot" style="background:${hex}"></span>
            <span class="object-name">${obj.name}</span>
          </div>
        `;
        item.addEventListener('click', () => selectObject(obj));
        objectListEl.appendChild(item);
      });
    }

    function updateInspector() {
      if (!selectedObject) {
        inspectorEmpty.style.display = 'block';
        inspectorContent.style.display = 'none';
        return;
      }
      inspectorEmpty.style.display = 'none';
      inspectorContent.style.display = 'block';

      document.getElementById('prop-name').value = selectedObject.name;
      const mat = selectedObject.userData.primaryMaterial;
      if (mat) {
        document.getElementById('prop-color').value = '#' + mat.color.getHexString();
        document.getElementById('prop-roughness').value = mat.roughness;
        document.getElementById('val-roughness').textContent = mat.roughness.toFixed(2);
        document.getElementById('prop-metalness').value = mat.metalness;
        document.getElementById('val-metalness').textContent = mat.metalness.toFixed(2);
        document.getElementById('prop-wireframe').checked = mat.wireframe;
      }
      syncTransformInputs(selectedObject);
    }

    function syncTransformInputs(obj) {
      document.getElementById('pos-x').value = obj.position.x.toFixed(2);
      document.getElementById('pos-y').value = obj.position.y.toFixed(2);
      document.getElementById('pos-z').value = obj.position.z.toFixed(2);

      document.getElementById('rot-x').value = THREE.MathUtils.radToDeg(obj.rotation.x).toFixed(1);
      document.getElementById('rot-y').value = THREE.MathUtils.radToDeg(obj.rotation.y).toFixed(1);
      document.getElementById('rot-z').value = THREE.MathUtils.radToDeg(obj.rotation.z).toFixed(1);

      document.getElementById('scl-x').value = obj.scale.x.toFixed(2);
      document.getElementById('scl-y').value = obj.scale.y.toFixed(2);
      document.getElementById('scl-z').value = obj.scale.z.toFixed(2);
    }

    // --- 8. Raycasting for Composite Objects ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (e.button !== 0) return;
      if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 5) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(sceneObjects, true);
      if (hits.length > 0) {
        let target = hits[0].object;
        while (target.parent && !sceneObjects.includes(target)) {
          target = target.parent;
        }
        selectObject(sceneObjects.includes(target) ? target : null);
      } else {
        selectObject(null);
      }
    });

    // --- 9. Event Listeners ---
    function setTransformMode(mode) {
      transformControls.setMode(mode);
      ['translate', 'rotate', 'scale'].forEach((m) => {
        document.getElementById(`mode-${m}`).classList.toggle('active', m === mode);
      });
    }

    document.getElementById('mode-translate').addEventListener('click', () => setTransformMode('translate'));
    document.getElementById('mode-rotate').addEventListener('click', () => setTransformMode('rotate'));
    document.getElementById('mode-scale').addEventListener('click', () => setTransformMode('scale'));

    document.getElementById('cam-reset').addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      orbit.target.copy(defaultTarget);
      orbit.update();
    });
    document.getElementById('cam-top').addEventListener('click', () => {
      camera.position.set(0, 18, 0.01);
      orbit.target.set(0, 0, 0);
      orbit.update();
    });
    document.getElementById('cam-front').addEventListener('click', () => {
      camera.position.set(0, 4, 15);
      orbit.target.set(0, 1.5, 0);
      orbit.update();
    });

    function focusSelected() {
      if (!selectedObject) return;
      const box = new THREE.Box3().setFromObject(selectedObject);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3()).length();
      const offset = camera.position.clone().sub(orbit.target).normalize().multiplyScalar(Math.max(size * 2.0, 3.5));
      orbit.target.copy(center);
      camera.position.copy(center).add(offset);
      orbit.update();
    }
    document.getElementById('cam-focus').addEventListener('click', focusSelected);

    document.getElementById('btn-delete').addEventListener('click', deleteSelected);
    document.getElementById('btn-duplicate').addEventListener('click', duplicateSelected);
    document.getElementById('btn-clear').addEventListener('click', () => clearScene(true));

    document.querySelectorAll('[data-tpl]').forEach((btn) => {
      btn.addEventListener('click', () => loadTemplate(btn.dataset.tpl));
    });
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchCategory(btn.dataset.cat));
    });

    // Inspector inputs
    document.getElementById('prop-name').addEventListener('input', (e) => {
      if (!selectedObject) return;
      selectedObject.name = e.target.value;
      renderObjectList();
    });
    document.getElementById('prop-color').addEventListener('input', (e) => {
      const mat = selectedObject?.userData?.primaryMaterial;
      if (!mat) return;
      mat.color.set(e.target.value);
      renderObjectList();
    });
    document.getElementById('prop-roughness').addEventListener('input', (e) => {
      const mat = selectedObject?.userData?.primaryMaterial;
      if (!mat) return;
      const v = parseFloat(e.target.value);
      mat.roughness = v;
      document.getElementById('val-roughness').textContent = v.toFixed(2);
    });
    document.getElementById('prop-metalness').addEventListener('input', (e) => {
      const mat = selectedObject?.userData?.primaryMaterial;
      if (!mat) return;
      const v = parseFloat(e.target.value);
      mat.metalness = v;
      document.getElementById('val-metalness').textContent = v.toFixed(2);
    });
    document.getElementById('prop-wireframe').addEventListener('change', (e) => {
      if (!selectedObject) return;
      selectedObject.traverse((c) => {
        if (c.isMesh && c.material) c.material.wireframe = e.target.checked;
      });
    });

    ['x', 'y', 'z'].forEach((axis) => {
      document.getElementById(`pos-${axis}`).addEventListener('input', (e) => {
        if (selectedObject) selectedObject.position[axis] = parseFloat(e.target.value) || 0;
      });
      document.getElementById(`rot-${axis}`).addEventListener('input', (e) => {
        if (selectedObject) selectedObject.rotation[axis] = THREE.MathUtils.degToRad(parseFloat(e.target.value) || 0);
      });
      document.getElementById(`scl-${axis}`).addEventListener('input', (e) => {
        if (selectedObject) selectedObject.scale[axis] = Math.max(0.05, parseFloat(e.target.value) || 0.05);
      });
    });

    // Environment inputs
    document.getElementById('env-bg').addEventListener('input', (e) => {
      scene.background = new THREE.Color(e.target.value);
    });
    document.getElementById('light-ambient').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      ambientLight.intensity = v;
      document.getElementById('val-ambient').textContent = v.toFixed(2);
    });
    document.getElementById('light-sun').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      dirLight.intensity = v;
      document.getElementById('val-sun').textContent = v.toFixed(2);
    });
    document.getElementById('light-angle').addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      const rad = THREE.MathUtils.degToRad(deg);
      dirLight.position.set(Math.cos(rad) * 16, 18, Math.sin(rad) * 16);
      document.getElementById('val-angle').textContent = `${deg}°`;
    });
    document.getElementById('toggle-grid').addEventListener('change', (e) => {
      gridHelper.visible = e.target.checked;
    });
    document.getElementById('toggle-axes').addEventListener('change', (e) => {
      axesHelper.visible = e.target.checked;
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'w') setTransformMode('translate');
      else if (key === 'e') setTransformMode('rotate');
      else if (key === 'r') setTransformMode('scale');
      else if (key === 'f') focusSelected();
      else if (key === 'escape') selectObject(null);
      else if (key === 'delete' || key === 'backspace') deleteSelected();
      else if ((e.ctrlKey || e.metaKey) && key === 'd') {
        e.preventDefault();
        duplicateSelected();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 10. Init ---
    loadTemplate('city');

    function animate() {
      requestAnimationFrame(animate);
      orbit.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
