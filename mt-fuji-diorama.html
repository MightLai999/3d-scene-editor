<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>富士山及其周邊著名景點 (1/100,000比例模型) — 精緻 3D 微縮場景</title>
  <style>
    :root {
      --bg-panel: rgba(16, 18, 24, 0.84);
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-hover: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #f472b6;
      --accent-blue: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1817;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .title-card {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 13px 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
      max-width: 330px;
    }

    .title-card h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .title-card p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #f9a8d4;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .back-link:hover {
      background: var(--bg-hover);
      border-color: rgba(244, 114, 182, 0.55);
    }

    .controls-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 264px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn.left-align { justify-content: flex-start; }

    .btn:hover {
      background: var(--bg-hover);
      border-color: rgba(244, 114, 182, 0.55);
    }

    .btn.active {
      background: rgba(244, 114, 182, 0.2);
      border-color: rgba(244, 114, 182, 0.8);
      color: #fdf2f8;
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 0;
    }

    .toggle-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .statusbar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .statusbar b { color: var(--text); font-weight: 600; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="title-card">
    <a href="./index.html" class="back-link">← 返回作品集首頁</a>
    <h1>🗻 富士山及其周邊著名景點 (1/100,000比例模型)</h1>
    <p>博物館級精緻立體剖面模型：富士山雪冠與地底岩漿脈、河口湖跨湖橋與水下魚群、忠靈塔五重塔櫻花林、富士急摩天輪與雲霄飛車、忍野八海合掌聚落、箱根海賊船、鳴澤冰穴與青木原樹海。</p>
  </div>

  <aside class="controls-panel">
    <div>
      <div class="section-label">展示燈光模式</div>
      <div class="btn-group">
        <button class="btn active" data-time="day">☀️ 白晝</button>
        <button class="btn" data-time="sunset">🌅 赤富士</button>
        <button class="btn" data-time="night">🌙 夜景</button>
      </div>
    </div>

    <div>
      <div class="section-label">微縮景點特寫導覽</div>
      <div class="btn-list">
        <button class="btn left-align active" data-cam="overview">🗻 經典微縮全景</button>
        <button class="btn left-align" data-cam="pagoda">⛩️ 忠靈塔與富士山</button>
        <button class="btn left-align" data-cam="magmaLake">🌋 岩漿與湖底剖面</button>
        <button class="btn left-align" data-cam="fujiQ">🎢 富士急樂園與列車</button>
        <button class="btn left-align" data-cam="iceOshino">🧊 鳴澤冰穴與忍野八海</button>
        <button class="btn left-align" data-cam="forest">🐻 青木原樹海與地底生態</button>
      </div>
    </div>

    <div>
      <div class="section-label">動態與顯示選項</div>
      <div class="toggle-row">
        <label for="opt-anim">動態特效（列車／摩天輪／海賊船／櫻吹雪）</label>
        <input type="checkbox" id="opt-anim" checked />
      </div>
      <div class="toggle-row">
        <label for="opt-orbit">自動展示台旋轉</label>
        <input type="checkbox" id="opt-orbit" />
      </div>
    </div>
  </aside>

  <div class="statusbar">
    <span><b>左鍵拖曳</b> 旋轉</span>
    <span><b>右鍵拖曳</b> 平移</span>
    <span><b>滾輪</b> 放大縮小</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. RENDERER, SCENE, CAMERA & DETERMINISTIC PRNG
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#cfc6ba');
    scene.fog = new THREE.FogExp2('#cfc6ba', 0.0042);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.4, 300);
    camera.position.set(-22, 23, 36);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    container.appendChild(renderer.domElement);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.06;
    orbit.maxPolarAngle = Math.PI / 2 - 0.015;
    orbit.minDistance = 8;
    orbit.maxDistance = 95;
    orbit.target.set(0, 1.2, 0.5);

    let seed = 20261126;
    function rand() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }
    function randRange(a, b) {
      return a + rand() * (b - a);
    }

    // =========================================================================
    // 2. STUDIO LIGHTING (DAY / AKA-FUJI SUNSET / NIGHT GLOW)
    // =========================================================================
    const hemiLight = new THREE.HemisphereLight(0xfff7ed, 0x475569, 0.92);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff5e4, 2.25);
    keyLight.position.set(-30, 38, 22);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 6;
    keyLight.shadow.camera.far = 115;
    const shD = 26;
    keyLight.shadow.camera.left = -shD;
    keyLight.shadow.camera.right = shD;
    keyLight.shadow.camera.top = shD;
    keyLight.shadow.camera.bottom = -shD;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xbfdbfe, 0.65);
    fillLight.position.set(26, 20, -24);
    scene.add(fillLight);

    const magmaLight1 = new THREE.PointLight(0xff5500, 1.4, 12, 1.6);
    magmaLight1.position.set(-16.2, -2.0, 13.6);
    scene.add(magmaLight1);

    const magmaLight2 = new THREE.PointLight(0xff6a00, 1.6, 13, 1.6);
    magmaLight2.position.set(-5.6, -2.5, 13.6);
    scene.add(magmaLight2);

    const iceLight = new THREE.PointLight(0x38bdf8, 1.8, 12, 1.5);
    iceLight.position.set(17.5, -1.6, 6.5);
    scene.add(iceLight);

    const nightLightRig = new THREE.PointLight(0xfde68a, 0.2, 22, 1.4);
    nightLightRig.position.set(4, 5, 3);
    scene.add(nightLightRig);

    const nightEmissives = [];

    // =========================================================================
    // 3. PROCEDURAL TEXTURES (WALNUT WOOD, PLAQUE, GEOLOGY STRATA)
    // =========================================================================
    function createWalnutTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6c4223';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 220; i++) {
        const y = rand() * 512;
        const h = 1 + rand() * 5;
        ctx.fillStyle = rand() > 0.5 ? 'rgba(42, 22, 10, 0.22)' : 'rgba(138, 88, 50, 0.16)';
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) {
          ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 3);
        }
        ctx.lineTo(512, y + h);
        ctx.lineTo(0, y + h);
        ctx.closePath();
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPlaqueTexture() {
      const c = document.createElement('canvas');
      c.width = 640;
      c.height = 180;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 640, 180);
      grad.addColorStop(0, '#d6dadf');
      grad.addColorStop(0.5, '#f1f5f9');
      grad.addColorStop(1, '#bcc3cc');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 640, 180);

      // Brushed metal streaks
      for (let y = 0; y < 180; y += 2) {
        ctx.fillStyle = y % 4 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.03)';
        ctx.fillRect(0, y, 640, 1);
      }

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 5;
      ctx.strokeRect(8, 8, 624, 164);

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 42px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('富士山及其周邊著名景點', 320, 68);

      ctx.fillStyle = '#334155';
      ctx.font = '600 28px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText('(1/100,000比例模型)', 320, 124);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createGeologyTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 384;
      const ctx = c.getContext('2d');

      // Base soil
      ctx.fillStyle = '#5c4028';
      ctx.fillRect(0, 0, 1024, 384);

      const strata = [
        { y0: 0, h: 52, col: '#4a6128' },   // Top humus & turf
        { y0: 36, h: 80, col: '#6d4c33' },  // Volcanic loam
        { y0: 100, h: 75, col: '#4b3b34' }, // Basalt & scoria
        { y0: 168, h: 70, col: '#7b5c42' }, // Ochre tuff
        { y0: 230, h: 82, col: '#3d3635' }, // Deep fractured lava rock
        { y0: 300, h: 90, col: '#2d292b' }  // Bedrock
      ];

      strata.forEach((s, idx) => {
        ctx.fillStyle = s.col;
        ctx.beginPath();
        ctx.moveTo(0, s.y0);
        for (let x = 0; x <= 1024; x += 24) {
          const wy = s.y0 + Math.sin(x * 0.015 + idx * 1.4) * 11 + Math.cos(x * 0.04) * 4;
          ctx.lineTo(x, wy);
        }
        ctx.lineTo(1024, 384);
        ctx.lineTo(0, 384);
        ctx.closePath();
        ctx.fill();
      });

      // Pebbles & geological grain
      for (let i = 0; i < 1600; i++) {
        const px = rand() * 1024;
        const py = 25 + rand() * 340;
        const r = 1 + rand() * 3.5;
        ctx.fillStyle = rand() > 0.5 ? 'rgba(255,235,205,0.1)' : 'rgba(15,10,8,0.22)';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Blue subterranean groundwater / aquifer vein (伏流水)
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.72)';
      ctx.lineWidth = 7;
      ctx.beginPath();
      for (let x = 0; x <= 1024; x += 16) {
        const y = 328 + Math.sin(x * 0.018) * 10;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const walnutTex = createWalnutTexture();
    const geologyTex = createGeologyTexture();

    // =========================================================================
    // 4. DIORAMA DIMENSIONS & SHARED CONTINUOUS TERRAIN FUNCTION
    // =========================================================================
    const W = 36;
    const D = 26;
    const BASE_Y = -4.2;
    const WATER_Y = -0.15;

    const root = new THREE.Group();
    scene.add(root);

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function gaussian2D(x, z, cx, cz, rx, rz) {
      const dx = (x - cx) / rx;
      const dz = (z - cz) / rz;
      return Math.exp(-(dx * dx + dz * dz));
    }

    function getTerrainHeight(x, z) {
      // Base gently undulating plains
      let h = 0.42 + Math.sin(x * 0.25) * Math.cos(z * 0.22) * 0.12 + Math.sin(x * 0.6 + z * 0.5) * 0.04;

      // 1. Mount Fuji centered at (-1.2, -3.5), iconic graceful concave stratovolcano
      const fx = x + 1.2;
      const fz = z + 3.5;
      const fr = Math.hypot(fx, fz);
      const theta = Math.atan2(fz, fx);
      const fujiMask = 1 - smoothstep(8.5, 13.5, fr);
      const ridges = (Math.sin(theta * 9 + fr * 0.15) * 0.28 + Math.sin(theta * 17 - fr * 0.2) * 0.14)
        * smoothstep(0.9, 3.2, fr) * (1 - smoothstep(5.5, 10.5, fr));
      let fujiH = 10.6 * Math.exp(-fr / 5.4) * fujiMask + ridges;
      // Summit volcanic crater indentation
      if (fr < 1.05) {
        fujiH -= (1 - smoothstep(0.15, 1.05, fr)) * 0.68;
      }
      h += fujiH;

      // 2. Chureito Pagoda Hill at (-10.5, -9.0)
      h += 2.75 * gaussian2D(x, z, -10.5, -9.0, 3.4, 3.0);
      // Secondary forested back-left knoll
      h += 1.65 * gaussian2D(x, z, -15.2, -9.8, 3.0, 2.8);
      // Back saddle hills behind Fuji
      h += 1.85 * gaussian2D(x, z, 4.2, -10.5, 2.6, 2.2);

      // 3. Hakone / Outer Rim Mountain Ridge along far-right edge (x in [12.5, 18.0], z in [-3.0, 12.0])
      const ridge1 = 4.2 * gaussian2D(x, z, 16.5, 5.2, 2.5, 3.2);
      const ridge2 = 3.5 * gaussian2D(x, z, 15.6, 0.8, 2.4, 2.8);
      const ridge3 = 3.9 * gaussian2D(x, z, 17.2, 9.6, 2.2, 2.6);
      const ridgeRough = (Math.sin(x * 1.4 + z * 1.1) * 0.28 + Math.cos(z * 2.1) * 0.2) * smoothstep(11.5, 15.5, x);
      h += ridge1 + ridge2 + ridge3 + ridgeRough;

      // 4. Lake Kawaguchiko Basin (front-left)
      const lakeUpper = gaussian2D(x, z, -13.0, -1.8, 3.3, 3.5);
      const lakeChannel = gaussian2D(x, z, -11.4, 4.2, 1.7, 2.8); // narrows under bridge
      const lakeMain = gaussian2D(x, z, -9.4, 9.8, 5.2, 4.6);
      const lakeFrontOutlet = gaussian2D(x, z, -9.2, 13.0, 4.4, 2.4);
      const kawaguchiMask = Math.min(1, lakeUpper * 1.35 + lakeChannel * 1.15 + lakeMain * 1.45 + lakeFrontOutlet * 1.35);
      h -= 2.45 * smoothstep(0.16, 0.72, kawaguchiMask);

      // Two tiny green islets inside Lake Kawaguchiko
      h += 1.75 * gaussian2D(x, z, -12.5, 2.5, 1.05, 0.9);
      h += 1.55 * gaussian2D(x, z, -7.2, 8.2, 0.95, 0.85);

      // 5. Lake Ashi Basin (back-right)
      const ashiMask = gaussian2D(x, z, 12.2, -7.6, 4.4, 4.2);
      h -= 1.85 * smoothstep(0.22, 0.75, ashiMask);

      // Ensure Oshino Hakkai & Fuji-Q Highland stay comfortably above water
      const plainFlatten = gaussian2D(x, z, 6.2, 4.2, 5.0, 5.5);
      if (plainFlatten > 0.45 && h < 0.48) {
        h = 0.48;
      }

      return h;
    }

    // =========================================================================
    // 5. DESK, STEPPED WALNUT PLINTH & ENGRAVED METALLIC PLAQUE
    // =========================================================================
    const desk = new THREE.Mesh(
      new THREE.BoxGeometry(105, 1.0, 80),
      new THREE.MeshStandardMaterial({ map: walnutTex, color: '#a0724c', roughness: 0.72 })
    );
    desk.position.set(0, -6.56, 0);
    desk.receiveShadow = true;
    root.add(desk);

    const walnutMat = new THREE.MeshStandardMaterial({ map: walnutTex, color: '#8f5a34', roughness: 0.52, metalness: 0.05 });
    const plinthLower = new THREE.Mesh(new THREE.BoxGeometry(38.8, 1.3, 28.8), walnutMat);
    plinthLower.position.set(0, -5.4, 0);
    plinthLower.castShadow = true;
    plinthLower.receiveShadow = true;
    root.add(plinthLower);

    const plinthUpper = new THREE.Mesh(new THREE.BoxGeometry(37.0, 0.55, 27.0), walnutMat);
    plinthUpper.position.set(0, -4.475, 0);
    plinthUpper.castShadow = true;
    plinthUpper.receiveShadow = true;
    root.add(plinthUpper);

    // Metallic Nameplate Plaque
    const plaqueGroup = new THREE.Group();
    plaqueGroup.position.set(-4.0, -5.25, 14.44);
    root.add(plaqueGroup);

    const plaqueBase = new THREE.Mesh(
      new THREE.BoxGeometry(7.2, 1.75, 0.14),
      new THREE.MeshStandardMaterial({ color: '#94a3b8', metalness: 0.75, roughness: 0.3 })
    );
    plaqueGroup.add(plaqueBase);

    const plaqueFace = new THREE.Mesh(
      new THREE.PlaneGeometry(7.05, 1.62),
      new THREE.MeshStandardMaterial({ map: createPlaqueTexture(), metalness: 0.55, roughness: 0.32 })
    );
    plaqueFace.position.z = 0.075;
    plaqueGroup.add(plaqueFace);

    const rivetGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.08, 10);
    rivetGeo.rotateX(Math.PI / 2);
    const rivetMat = new THREE.MeshStandardMaterial({ color: '#475569', metalness: 0.85, roughness: 0.25 });
    for (const [rx, ry] of [[-3.3, 0.65], [3.3, 0.65], [-3.3, -0.65], [3.3, -0.65]]) {
      const rv = new THREE.Mesh(rivetGeo, rivetMat);
      rv.position.set(rx, ry, 0.08);
      plaqueGroup.add(rv);
    }

    // =========================================================================
    // 6. HIGH-RES SCULPTED TERRAIN MESH WITH VERTEX COLORING
    // =========================================================================
    const segX = 180;
    const segZ = 130;
    const terrainGeo = new THREE.PlaneGeometry(W, D, segX, segZ);
    terrainGeo.rotateX(-Math.PI / 2);

    const tPos = terrainGeo.attributes.position;
    const tColors = new Float32Array(tPos.count * 3);
    const col = new THREE.Color();

    for (let i = 0; i < tPos.count; i++) {
      const x = tPos.getX(i);
      const z = tPos.getZ(i);
      const y = getTerrainHeight(x, z);
      tPos.setY(i, y);

      const fx = x + 1.2;
      const fz = z + 3.5;
      const fr = Math.hypot(fx, fz);
      const theta = Math.atan2(fz, fx);
      const gully = Math.sin(theta * 9 + fr * 0.15) * 0.5 + Math.sin(theta * 17) * 0.3;

      if (y < WATER_Y - 0.02) {
        // Underwater lakebed sand/gravel
        const depthT = Math.min(1, (WATER_Y - y) / 1.8);
        col.set('#8ca0a6').lerp(new THREE.Color('#475f6b'), depthT);
      } else if (fr < 9.5 && y > 4.6 + gully * 0.72) {
        // Crisp jagged Mt. Fuji snowcap
        col.set('#f8fafc').lerp(new THREE.Color('#dbeafe'), Math.max(0, 1 - (y - 4.6) / 3.0) * 0.35);
      } else if (fr < 10.5 && y > 2.35) {
        // Volcanic blue-slate scoria mid-slopes
        const slopeT = smoothstep(2.35, 5.2, y);
        col.set('#4c5c4a').lerp(new THREE.Color('#536274'), slopeT);
      } else if (x > 13.0 && y > 3.5) {
        // Snow-dusted tips on Hakone right-edge ridge
        col.set('#6b7f5a').lerp(new THREE.Color('#f1f5f9'), smoothstep(3.5, 4.6, y) * 0.88);
      } else {
        // Lush multi-tone Japanese greenery & meadows
        const n = Math.sin(x * 0.9) * Math.cos(z * 0.9) * 0.5 + 0.5;
        col.set('#3d6b26').lerp(new THREE.Color('#5d8e35'), n);
        // Slightly darker dense forest on front-right Aokigahara
        if (x > 0 && z > 5.5 && x < 11) {
          col.lerp(new THREE.Color('#2d4f1e'), 0.48);
        }
      }

      tColors[i * 3] = col.r;
      tColors[i * 3 + 1] = col.g;
      tColors[i * 3 + 2] = col.b;
    }

    // =========================================================================
    // 7. FOUR-SIDED GEOLOGICAL CUTAWAY WALLS + ICE CAVERN INDENTATION
    // =========================================================================
    function buildCutawayWall(axis, fixedVal, count, start, end, flipWinding, indentFn = null) {
      const positions = [];
      const uvs = [];
      const indices = [];

      const rows = 14;
      for (let i = 0; i <= count; i++) {
        const u = i / count;
        const coord = start + (end - start) * u;
        const x = axis === 'z' ? coord : fixedVal;
        const z = axis === 'z' ? fixedVal : coord;
        const topY = getTerrainHeight(x, z);

        for (let r = 0; r <= rows; r++) {
          const v = r / rows;
          const y = BASE_Y + (topY - BASE_Y) * v;
          let wx = x;
          let wz = z;
          if (indentFn) {
            const offset = indentFn(coord, y);
            if (axis === 'x') wx += offset;
            else wz += offset;
          }
          positions.push(wx, y, wz);
          uvs.push(u * 1.4, (y - BASE_Y) / 14.8);
        }
      }

      const stride = rows + 1;
      for (let i = 0; i < count; i++) {
        for (let r = 0; r < rows; r++) {
          const a = i * stride + r;
          const b = (i + 1) * stride + r;
          const c = (i + 1) * stride + (r + 1);
          const d = i * stride + (r + 1);
          if (!flipWinding) {
            indices.push(a, b, c, a, c, d);
          } else {
            indices.push(a, c, b, a, d, c);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // Front wall (z = +13)

      if (z < 3.6 || z > 9.4 || y > 0.9) return 0;
      const cz = (z - 6.5) / 2.9;
      const cy = (y + 1.55) / 2.35;
      const rad = Math.hypot(cz, cy);
      if (rad >= 1) return 0;
      return -2.5 * Math.cos(rad * Math.PI * 0.5);

    // Water surface mesh clipped cleanly inside Lake Kawaguchiko & Lake Ashi
    function createLakeSurface(xMin, xMax, zMin, zMax) {
      const subX = 64, subZ = 64;
      const g = new THREE.PlaneGeometry(xMax - xMin, zMax - zMin, subX, subZ);
      g.rotateX(-Math.PI / 2);
      const p = g.attributes.position;
      const cx = (xMin + xMax) / 2;
      const cz = (zMin + zMax) / 2;
      const idx = g.index;
      const validIndices = [];
      for (let i = 0; i < idx.count; i += 3) {
        const a = idx.getX(i), b = idx.getX(i + 1), c = idx.getX(i + 2);
        const ya = getTerrainHeight(p.getX(a) + cx, p.getZ(a) + cz);
        const yb = getTerrainHeight(p.getX(b) + cx, p.getZ(b) + cz);
        const yc = getTerrainHeight(p.getX(c) + cx, p.getZ(c) + cz);
        if (ya < WATER_Y + 0.16 || yb < WATER_Y + 0.16 || yc < WATER_Y + 0.16) {
          validIndices.push(a, b, c);
        }
      }
      g.setIndex(validIndices);
      g.computeVertexNormals();
      const mesh = new THREE.Mesh(g, lakeWaterMat);
      mesh.position.set(cx, WATER_Y, cz);
      mesh.receiveShadow = true;
      root.add(mesh);
    }

        pts.length

      keyLight.color.setHex(p.keyCol);
      keyLight.intensity = p.keyInt;

      fillLight.intensity = p.fillInt;
      iceLight.intensity = p.iceInt;
      nightLightRig.intensity = p.nightRig;

      pagoda:    { pos: [-17, 9.5, -13.5], target: [-4.5, 4.5, -5.0] },
      magmaLake: { pos: [-12, 3.5, 25], target: [-10.0, -1.2, 10.5] },
      fujiQ:     { pos: [-3.5, 9.5, 14.5], target: [2.2, 1.8, 0.5] },
      iceOshino: { pos: [25, 4.5, 18.5], target: [12.5, 0.2, 4.5] },
      forest:    { pos: [6.5, 4.0, 23.5], target: [4.5, -0.5, 10.5] }
    };

    let camAnim = null;
    function flyTo(name) {
      const p = CAM_PRESETS[name];
      if (!p) return;
      camAnim = {
        startPos: camera.position.clone(),
        endPos: new THREE.Vector3(...p.pos),
        startTarget: orbit.target.clone(),
        endTarget: new THREE.Vector3(...p.target),
        t: 0
      };
      document.querySelectorAll('[data-cam]').forEach((b) => {
        b.classList.toggle('active', b.dataset.cam === name);
      });
    }

    document.querySelectorAll('[data-time]').forEach((b) => b.addEventListener('click', () => setTimeOfDay(b.dataset.time)));
    document.querySelectorAll('[data-cam]').forEach((b) => b.addEventListener('click', () => flyTo(b.dataset.cam)));

    const optAnim = document.getElementById('opt-anim');
    const optOrbit = document.getElementById('opt-orbit');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 14. ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      if (camAnim) {
        camAnim.t = Math.min(1, camAnim.t + dt * 1.4);
        const ease = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        orbit.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (camAnim.t >= 1) camAnim = null;
      }

      orbit.autoRotate = optOrbit.checked;
      orbit.autoRotateSpeed = 0.75;
      orbit.update();

      // Subtle magma glow pulse
      magmaMat.emissiveIntensity = 1.7 + Math.sin(t * 2.6) * 0.35;

      if (optAnim.checked) {
        // Ferris wheel rotation
        wheelRotor.rotation.z -= dt * 0.32;

        // Roller coaster 3-car train racing
        const cu = (t * 0.14) % 1;
        coasterCars.forEach((car, idx) => {
          const u = (cu - idx * 0.025 + 1) % 1;
          const cPos = coasterCurve.getPointAt(u);
          const cNext = coasterCurve.getPointAt((u + 0.015) % 1);
          car.position.copy(cPos);
          car.lookAt(cNext);
        });

        // Scenic mountain train gliding back & forth smoothly
        const baseU = 0.12 + 0.76 * (0.5 - 0.5 * Math.cos(t * 0.32));
        trainCars.forEach((car, idx) => {
          const u = Math.max(0.01, Math.min(0.99, baseU - idx * 0.045));
          const pos = railCurve.getPointAt(u);
          const look = railCurve.getPointAt(Math.min(0.995, u + 0.015));
          car.position.copy(pos);
          car.lookAt(look);
        });

        // Pirate ship & Lake boats gentle bobbing
        pirateShip.position.y = WATER_Y + Math.sin(t * 1.8) * 0.035;
        pirateShip.rotation.z = Math.sin(t * 1.4) * 0.035;
        pirateShip.position.x = 11.6 + Math.sin(t * 0.25) * 1.1;
        boats.forEach((b) => {
          b.mesh.position.y = b.baseY + Math.sin(t * 2.1 + b.phase) * 0.02;
        });

        // Lake fish swimming & underwater weeds swaying
        lakeFish.forEach((f) => {
          f.angle += dt * f.speed;
          f.mesh.position.x = f.cx + Math.cos(f.angle) * f.radius;
          f.mesh.position.z = f.cz + Math.sin(f.angle) * f.radius;
          f.mesh.rotation.y = -f.angle;
        });
        lakeWeeds.forEach((w) => {
          w.mesh.rotation.z = Math.sin(t * 2.2 + w.phase) * 0.18;
        });

        // Falling sakura petals
        const pArr = petalGeo.attributes.position.array;
        for (let i = 0; i < petalCount; i++) {
          const v = petalVel[i];
          pArr[i * 3] += Math.sin(t * 1.5 + v.phase) * dt * 0.22 + v.vx * dt;
          pArr[i * 3 + 1] -= v.vy * dt;
          if (pArr[i * 3 + 1] < 0.05) {
            pArr[i * 3] = -16.5 + (i * 0.618 % 1) * 14.0;
            pArr[i * 3 + 1] = 6.2;
          }
        }
        petalGeo.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
