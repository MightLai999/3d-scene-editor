<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高雄車站與周邊街區 — 精緻 3D 建築空拍場景</title>
  <style>
    :root {
      --bg-panel: rgba(15, 19, 28, 0.84);
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-hover: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.13);
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .title-card {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 12px 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      max-width: 310px;
    }

    .title-card h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .title-card p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .back-link:hover {
      background: var(--bg-hover);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .controls-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 252px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn.left-align { justify-content: flex-start; }

    .btn:hover {
      background: var(--bg-hover);
      border-color: rgba(56, 189, 248, 0.5);
    }

    .btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.78);
      color: #e0f2fe;
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      padding: 2px 0;
    }

    .toggle-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .statusbar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .statusbar b { color: var(--text); font-weight: 600; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="title-card">
    <a href="./index.html" class="back-link">← 返回作品集首頁</a>
    <h1>🚄 高雄車站與周邊街區</h1>
    <p>依實景空拍建置：西側純白商業大樓、東側圓筒旅館大樓、環抱式雲朵天棚與圓形天井、帝冠式舊車站、北側球形木格柵與紅藍彩繪引道。</p>
  </div>

  <aside class="controls-panel">
    <div>
      <div class="section-label">白晝 / 黃昏 / 黑夜</div>
      <div class="btn-group">
        <button class="btn active" data-time="day">☀️ 白晝</button>
        <button class="btn" data-time="sunset">🌅 黃昏</button>
        <button class="btn" data-time="night">🌙 黑夜</button>
      </div>
    </div>

    <div>
      <div class="section-label">實景空拍視角</div>
      <div class="btn-list">
        <button class="btn left-align active" data-cam="southAerial">🚁 南向北經典空拍（中山路）</button>
        <button class="btn left-align" data-cam="oldStation">🏛️ 帝冠式舊車站特寫</button>
        <button class="btn left-align" data-cam="northAerial">🌐 北向南空拍（博愛路球體）</button>
        <button class="btn left-align" data-cam="canopyTop">🌿 雲朵天棚與雙塔俯瞰</button>
        <button class="btn left-align" data-cam="nightPlaza">✨ 天棚下沉廣場近景</button>
      </div>
    </div>

    <div>
      <div class="section-label">場景選項</div>
      <div class="toggle-row">
        <label for="opt-orbit">自動空拍環繞</label>
        <input type="checkbox" id="opt-orbit" />
      </div>
      <div class="toggle-row">
        <label for="opt-traffic">動態車流與公車</label>
        <input type="checkbox" id="opt-traffic" checked />
      </div>
    </div>
  </aside>

  <div class="statusbar">
    <span><b>左鍵拖曳</b> 旋轉</span>
    <span><b>右鍵拖曳</b> 平移</span>
    <span><b>滾輪</b> 放大縮小</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. RENDERER, SCENE & CAMERA
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8ec0e8');
    scene.fog = new THREE.FogExp2('#b8d4ec', 0.0019);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.5, 1100);
    camera.position.set(0, 56, 118);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.06;
    orbit.maxPolarAngle = Math.PI / 2 - 0.025;
    orbit.minDistance = 12;
    orbit.maxDistance = 300;
    orbit.target.set(0, 6, 4);

    // =========================================================================
    // 2. LIGHTING (DAY / SUNSET / NIGHT)
    // =========================================================================
    const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x64748b, 0.9);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.2);
    sunLight.position.set(90, 125, 75);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 380;
    const shD = 140;
    sunLight.shadow.camera.left = -shD;
    sunLight.shadow.camera.right = shD;
    sunLight.shadow.camera.top = shD;
    sunLight.shadow.camera.bottom = -shD;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    const plazaLight = new THREE.PointLight(0xffedd5, 0.8, 70, 1.3);
    plazaLight.position.set(0, 6.5, -2);
    scene.add(plazaLight);

    const oldStationLight = new THREE.PointLight(0xfef3c7, 0.3, 40, 1.4);
    oldStationLight.position.set(0, 8, 36);
    scene.add(oldStationLight);

    const nightEmissiveMats = [];

    // =========================================================================
    // 3. PROCEDURAL ARCHITECTURAL TEXTURES
    // =========================================================================
    function createWindowTexture(cols, rows, baseColor, glassColor, litColor, litRatio = 0.3) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, c.width, c.height);

      const padX = 5;
      const padY = 7;
      const cellW = c.width / cols;
      const cellH = c.height / rows;

      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          const isLit = Math.random() < litRatio;
          ctx.fillStyle = isLit ? litColor : glassColor;
          ctx.fillRect(col * cellW + padX, r * cellH + padY, cellW - padX * 2, cellH - padY * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.fillRect(col * cellW + padX, r * cellH + padY, (cellW - padX * 2) * 0.35, cellH - padY * 2);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createSignTexture(text, bg = '#64748b', fg = '#f8fafc') {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 120, 120);
      ctx.fillStyle = fg;
      ctx.font = 'bold 74px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 68);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPavingTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 16) {
        for (let x = 0; x < 256; x += 32) {
          const shade = 195 + Math.floor(Math.random() * 28);
          ctx.fillStyle = `rgb(${shade},${shade + 2},${shade + 5})`;
          ctx.fillRect(x + (y % 32 ? 16 : 0), y, 30, 14);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createRoadTexture(laneColor = '#333a44') {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = laneColor;
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (let y = 0; y < 256; y += 44) {
        ctx.fillRect(126, y, 4, 22);
      }
      ctx.fillRect(8, 0, 4, 256);
      ctx.fillRect(244, 0, 4, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const cityTex1 = createWindowTexture(5, 10, '#cbd5e1', '#334155', '#93c5fd', 0.22);
    const cityTex2 = createWindowTexture(4, 8, '#d6cbb8', '#3f3f46', '#fde68a', 0.2);
    const cityTex3 = createWindowTexture(6, 12, '#94a3b8', '#1e293b', '#bae6fd', 0.25);
    const cityEmissiveTex = createWindowTexture(5, 10, '#000000', '#000000', '#fef08a', 0.35);
    const pavingTex = createPavingTexture();

    function makeCityMat(mapTex, tint = 0xffffff, rough = 0.55, metal = 0.15) {
      const m = new THREE.MeshStandardMaterial({
        map: mapTex,
        color: tint,
        roughness: rough,
        metalness: metal,
        emissive: new THREE.Color('#ffedd5'),
        emissiveMap: cityEmissiveTex,
        emissiveIntensity: 0.04
      });
      nightEmissiveMats.push({ mat: m, day: 0.04, sunset: 0.45, night: 1.35 });
      return m;
    }

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // =========================================================================
    // 4. GROUND, COLORED STATION LOOP ROADS (紅藍引道) & GREEN CORRIDOR
    // =========================================================================
    const baseGround = new THREE.Mesh(
      new THREE.PlaneGeometry(520, 520),
      new THREE.MeshStandardMaterial({ color: '#bfc7d1', roughness: 0.92 })
    );
    baseGround.rotation.x = -Math.PI / 2;
    baseGround.position.y = -0.08;
    baseGround.receiveShadow = true;
    worldGroup.add(baseGround);

    // Central Station Plaza Paved Platform
    const mainPlaza = new THREE.Mesh(
      new THREE.CylinderGeometry(52, 54, 0.16, 48),
      new THREE.MeshStandardMaterial({ map: pavingTex, roughness: 0.82 })
    );
    mainPlaza.scale.set(1.05, 1, 1.18);
    mainPlaza.position.set(0, 0.02, 2);
    mainPlaza.receiveShadow = true;
    worldGroup.add(mainPlaza);

    // Iconic Brick-Red (West/Left) & Sky-Blue (East/Right) Colored Lanes on Zhongshan 1st Rd
    const redLaneTex = createRoadTexture('#8c4347');
    redLaneTex.repeat.set(1, 5);
    const blueLaneTex = createRoadTexture('#2589d8');
    blueLaneTex.repeat.set(1, 5);
    const grayRoadTex = createRoadTexture('#343b46');
    grayRoadTex.repeat.set(1, 14);

    // Zhongshan 1st Rd (South axis: z = 54..180)
    const zhongshanRed = new THREE.Mesh(
      new THREE.PlaneGeometry(8.5, 120),
      new THREE.MeshStandardMaterial({ map: redLaneTex, roughness: 0.8 })
    );
    zhongshanRed.rotation.x = -Math.PI / 2;
    zhongshanRed.position.set(-5.2, 0.08, 114);
    zhongshanRed.receiveShadow = true;
    worldGroup.add(zhongshanRed);

    const zhongshanBlue = new THREE.Mesh(
      new THREE.PlaneGeometry(8.5, 120),
      new THREE.MeshStandardMaterial({ map: blueLaneTex, roughness: 0.8 })
    );
    zhongshanBlue.rotation.x = -Math.PI / 2;
    zhongshanBlue.position.set(5.2, 0.08, 114);
    zhongshanBlue.receiveShadow = true;
    worldGroup.add(zhongshanBlue);

    // Yellow median strip between red & blue lanes
    const median = new THREE.Mesh(
      new THREE.PlaneGeometry(1.8, 120),
      new THREE.MeshStandardMaterial({ color: '#eab308', roughness: 0.85 })
    );
    median.rotation.x = -Math.PI / 2;
    median.position.set(0, 0.09, 114);
    worldGroup.add(median);

    // Curved Colored Loop Aprons embracing the South Plaza (Photo 1 & 3)
    const redArc = new THREE.Mesh(
      new THREE.RingGeometry(44, 52.5, 28, 1, Math.PI * 0.52, Math.PI * 0.36),
      new THREE.MeshStandardMaterial({ color: '#8c4347', roughness: 0.82 })
    );
    redArc.rotation.x = -Math.PI / 2;
    redArc.position.set(-4, 0.07, 14);
    redArc.receiveShadow = true;
    worldGroup.add(redArc);

    const blueArc = new THREE.Mesh(
      new THREE.RingGeometry(44, 52.5, 28, 1, Math.PI * 0.12, Math.PI * 0.36),
      new THREE.MeshStandardMaterial({ color: '#2589d8', roughness: 0.82 })
    );
    blueArc.rotation.x = -Math.PI / 2;
    blueArc.position.set(4, 0.07, 14);
    blueArc.receiveShadow = true;
    worldGroup.add(blueArc);

    // Bo'ai 1st Rd (North axis: z = -54..-180)
    const boaiRoad = new THREE.Mesh(
      new THREE.PlaneGeometry(17, 130),
      new THREE.MeshStandardMaterial({ map: grayRoadTex, roughness: 0.85 })
    );
    boaiRoad.rotation.x = -Math.PI / 2;
    boaiRoad.position.set(0, 0.06, -120);
    boaiRoad.receiveShadow = true;
    worldGroup.add(boaiRoad);

    // Jianguo Rd (East-West South) & Jiuru Rd (East-West North)
    for (const rz of [54, -56]) {
      const rTex = createRoadTexture('#343b46');
      rTex.repeat.set(1, 20);
      const rMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(13, 380),
        new THREE.MeshStandardMaterial({ map: rTex, roughness: 0.85 })
      );
      rMesh.rotation.x = -Math.PI / 2;
      rMesh.rotation.z = Math.PI / 2;
      rMesh.position.set(0, 0.05, rz);
      rMesh.receiveShadow = true;
      worldGroup.add(rMesh);
    }

    // Green Corridor (東西向綠園道)
    const greenCorridorMat = new THREE.MeshStandardMaterial({ color: '#5b8a2f', roughness: 0.92 });
    for (const sx of [-125, 125]) {
      const gc = new THREE.Mesh(new THREE.BoxGeometry(140, 0.14, 22), greenCorridorMat);
      gc.position.set(sx, 0.02, -4);
      gc.receiveShadow = true;
      worldGroup.add(gc);
    }

    // =========================================================================
    // 5. WEST COMMERCIAL TOWER (西側純白水平線條商業大樓 — Photo 1 & 3 Left)
    // =========================================================================
    function createRoundedRectShape(w, d, r) {
      const s = new THREE.Shape();
      const hw = w / 2, hd = d / 2;
      s.moveTo(-hw + r, -hd);
      s.lineTo(hw - r, -hd);
      s.quadraticCurveTo(hw, -hd, hw, -hd + r);
      s.lineTo(hw, hd - r);
      s.quadraticCurveTo(hw, hd, hw - r, hd);
      s.lineTo(-hw + r, hd);
      s.quadraticCurveTo(-hw, hd, -hw, hd - r);
      s.lineTo(-hw, -hd + r);
      s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
      return s;
    }

    const westTower = new THREE.Group();
    westTower.position.set(-29, 0, -2);
    worldGroup.add(westTower);

    const commW = 24, commD = 32, commH = 32;
    const commShape = createRoundedRectShape(commW, commD, 4.5);

    // Inner teal-blue glass core
    const tealGlassMat = new THREE.MeshStandardMaterial({
      color: '#1b6b84',
      roughness: 0.18,
      metalness: 0.65,
      emissive: new THREE.Color('#7dd3fc'),
      emissiveIntensity: 0.06
    });
    nightEmissiveMats.push({ mat: tealGlassMat, day: 0.06, sunset: 0.35, night: 0.85 });

    const commCoreGeo = new THREE.ExtrudeGeometry(commShape, { depth: commH - 2, bevelEnabled: false, curveSegments: 16 });
    commCoreGeo.rotateX(-Math.PI / 2);
    const commCore = new THREE.Mesh(commCoreGeo, tealGlassMat);
    commCore.scale.set(0.96, 1, 0.96);
    commCore.position.y = 0.5;
    commCore.castShadow = true;
    commCore.receiveShadow = true;
    westTower.add(commCore);

    // Iconic Pure White Horizontal Ribbed Louver Bands wrapping the rounded rectangle
    const whiteFacadeMat = new THREE.MeshStandardMaterial({ color: '#f1f5f9', roughness: 0.42, metalness: 0.08 });
    for (let f = 0; f < 10; f++) {
      // Leave a signature taller glass reveal band around floor 6-7 (as seen in Photo 1 & 3)
      const bandH = (f === 6) ? 0.9 : 2.15;
      const yPos = 1.0 + f * 2.95;
      const bandGeo = new THREE.ExtrudeGeometry(commShape, { depth: bandH, bevelEnabled: false, curveSegments: 16 });
      bandGeo.rotateX(-Math.PI / 2);
      const band = new THREE.Mesh(bandGeo, whiteFacadeMat);
      band.position.y = yPos;
      band.castShadow = true;
      band.receiveShadow = true;
      westTower.add(band);
    }

    // Perforated white crown parapet & rooftop solar panel arrays
    const crownHole = createRoundedRectShape(commW - 4, commD - 4, 3.0);
    const crownShape = createRoundedRectShape(commW + 0.4, commD + 0.4, 4.6);
    crownShape.holes.push(crownHole);
    const crownGeo = new THREE.ExtrudeGeometry(crownShape, { depth: 3.2, bevelEnabled: false, curveSegments: 16 });
    crownGeo.rotateX(-Math.PI / 2);
    const crown = new THREE.Mesh(crownGeo, whiteFacadeMat);
    crown.position.y = commH - 2.0;
    crown.castShadow = true;
    westTower.add(crown);

    const solarMat = new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.2, metalness: 0.7 });
    for (const sx of [-9.5, 9.5]) {
      const sp = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.25, 24), solarMat);
      sp.position.set(sx, commH + 1.25, 0);
      westTower.add(sp);
    }

    // =========================================================================
    // 6. EAST HOTEL TOWER (東側圓筒木格柵旅館大樓 — Photo 1 & 3 Right)
    // =========================================================================
    const eastTower = new THREE.Group();
    eastTower.position.set(29, 0, -2);
    worldGroup.add(eastTower);

    const hotelR = 13.5, hotelH = 31;
    // Inner dark glass cylinder
    const hotelGlassMat = new THREE.MeshStandardMaterial({
      color: '#1e293b',
      roughness: 0.22,
      metalness: 0.55,

    const TIME_PRESETS = {
      day: {
        bg: '#8ec0e8', fog: '#b8d4ec', fogDensity: 0.0019,
        hemiSky: 0xe0f2fe, hemiGround: 0x64748b, hemiInt: 0.9,
        sunColor: 0xfffbeb, sunInt: 2.2, sunPos: [90, 125, 75],
        plazaInt: 0.8, oldInt: 0.3, exposure: 1.05
      },
      sunset: {
        bg: '#c77252', fog: '#dc8f6c', fogDensity: 0.0024,
        hemiSky: 0xfdba74, hemiGround: 0x334155, hemiInt: 0.65,
        sunColor: 0xff8c42, sunInt: 2.35, sunPos: [-120, 34, 55],
        plazaInt: 2.5, oldInt: 1.4, exposure: 1.0
      },
      night: {
        bg: '#070b16', fog: '#0d1426', fogDensity: 0.0028,
        hemiSky: 0x1e293b, hemiGround: 0x0f172a, hemiInt: 0.42,
        sunColor: 0x60a5fa, sunInt: 0.45, sunPos: [65, 85, -55],
        plazaInt: 5.0, oldInt: 3.2, exposure: 1.18
      }
    };

    function setTimeOfDay(mode) {
      const p = TIME_PRESETS[mode];
      scene.background.set(p.bg);
      scene.fog.color.set(p.fog);
      scene.fog.density = p.fogDensity;
      hemiLight.color.setHex(p.hemiSky);
      hemiLight.groundColor.setHex(p.hemiGround);
      hemiLight.intensity = p.hemiInt;
      sunLight.color.setHex(p.sunColor);
      sunLight.intensity = p.sunInt;
      sunLight.position.set(...p.sunPos);
      plazaLight.intensity = p.plazaInt;
      oldStationLight.intensity = p.oldInt;
      renderer.toneMappingExposure = p.exposure;

      nightEmissiveMats.forEach((item) => {
        item.mat.emissiveIntensity = item[mode];
      });

      document.querySelectorAll('[data-time]').forEach((b) => {
        b.classList.toggle('active', b.dataset.time === mode);
      });
    }

    const CAM_PRESETS = {
      southAerial: { pos: [0, 56, 118], target: [0, 6, 4] },
      oldStation:  { pos: [0, 14, 56], target: [0, 5.5, 25] },
      northAerial: { pos: [0, 24, -84], target: [0, 7, -14] },
      canopyTop:   { pos: [46, 58, 52], target: [0, 8, 2] },
      nightPlaza:  { pos: [-26, 14, 48], target: [0, 6, 12] }
    };

    let camAnim = null;
    function flyTo(name) {
      const p = CAM_PRESETS[name];
      if (!p) return;
      camAnim = {
        startPos: camera.position.clone(),
        endPos: new THREE.Vector3(...p.pos),
        startTarget: orbit.target.clone(),
        endTarget: new THREE.Vector3(...p.target),
        t: 0
      };
      document.querySelectorAll('[data-cam]').forEach((b) => {
        b.classList.toggle('active', b.dataset.cam === name);
      });
    }

    document.querySelectorAll('[data-time]').forEach((b) => {
      b.addEventListener('click', () => setTimeOfDay(b.dataset.time));
    });
    document.querySelectorAll('[data-cam]').forEach((b) => {
      b.addEventListener('click', () => flyTo(b.dataset.cam));
    });

    const optOrbit = document.getElementById('opt-orbit');
    const optTraffic = document.getElementById('opt-traffic');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 14. RENDER LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (camAnim) {
        camAnim.t = Math.min(1, camAnim.t + dt * 1.35);
        const ease = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        orbit.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (camAnim.t >= 1) camAnim = null;
      }

      orbit.autoRotate = optOrbit.checked;
      orbit.autoRotateSpeed = 0.6;
      orbit.update();

      if (optTraffic.checked) {
        vehicles.forEach((v) => {
          if (v.axis === 'x') {
            v.mesh.position.x += v.dir * v.speed * dt;
            if (v.mesh.position.x > 165) v.mesh.position.x = -165;
            if (v.mesh.position.x < -165) v.mesh.position.x = 165;
          } else {
            v.mesh.position.z += v.dir * v.speed * dt;
            if (v.dir > 0 && v.mesh.position.z > -54 && v.mesh.position.z < 56) v.mesh.position.z = 56;
            if (v.dir < 0 && v.mesh.position.z < 56 && v.mesh.position.z > -54) v.mesh.position.z = -54;
            if (v.mesh.position.z > 165) v.mesh.position.z = -165;
            if (v.mesh.position.z < -165) v.mesh.position.z = 165;
          }
        });
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
